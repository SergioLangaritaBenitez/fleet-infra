apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oscar
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: oscar
    namespace: flux-system
  path: "./deploy/yaml"
  prune: true
  timeout: 1m
  postBuild:
    substitute:
      OSCAR_IMAGE: "ghcr.io/grycap/oscar:4.2.0" # {"$imagepolicy": "flux-system:oscar"}
    substituteFrom:
      - kind: Secret
        name: gateway-tls-config
  # Borra la lista env de upstream (7 literales con valores viejos en
  # desustanciao/oscar@devel:deploy/yaml/oscar-deployment.yaml) para que no
  # tapen al envFrom (env explícito gana a envFrom). Sin esto, el rollout
  # "resucita" MINIO_ENDPOINT=http://minio.minio:9000 y admin/password.
  patchesJson6902:
    - target:
        kind: Deployment
        name: oscar
      patch:
        - op: remove
          path: /spec/template/spec/containers/0/env
  patches:
    # Todas las env vars via envFrom:
    # - ConfigMap/oscar-env (configmap.yaml de esta carpeta, en Git)
    # - Secret/oscar-credentials (secret.example.yaml como plantilla,
    #   creado a mano fuera de Git)
    - patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: oscar
        spec:
          template:
            spec:
              containers:
                - name: oscar
                  image: ${OSCAR_IMAGE}
                  envFrom:
                    - configMapRef:
                        name: oscar-env
                    - secretRef:
                        name: oscar-credentials
      target:
        kind: Deployment
        name: oscar
    # The live deploy only sets requests (500m/512Mi); upstream adds
    # lower limits (250m/256Mi) and the API rejects it
    # (requests must be <= limits). Limits are removed.
    - patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: oscar
        spec:
          template:
            spec:
              containers:
                - name: oscar
                  resources:
                    limits: null
      target:
        kind: Deployment
        name: oscar
    # PVC oscar-pvc already exists in the cluster (Bound, managed-nfs-storage)
    # and storageClassName is immutable: request the one it already has.
    - patch: |-
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: oscar-pvc
        spec:
          storageClassName: managed-nfs-storage
      target:
        kind: PersistentVolumeClaim
        name: oscar-pvc
