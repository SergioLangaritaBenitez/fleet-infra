---
# Gateway defines the actual listeners.
# The GatewayClass is created and owned by the Traefik Helm chart.
# HTTPRoutes in any namespace can bind to it via parentRefs.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway
  namespace: traefik
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: All
    # Termina TLS con los certificados Let's Encrypt (gestionados por
    # cert-manager, fuera de Flux) y sirve las mismas HTTPRoutes por HTTPS.
    # NOTA: este Traefik solo procesa el PRIMER certificateRef de cada
    # listener, así que se usan dos listeners (mismo puerto, distinto
    # hostname), uno por certificado.
    - name: websecure-apex
      protocol: HTTPS
      port: 8443
      hostname: mystifying-lederberg8.im.grycap.net
      tls:
        mode: Terminate
        certificateRefs:
          - name: mystifying-lederberg8.im.grycap.net-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: websecure-wildcard
      protocol: HTTPS
      port: 8443
      hostname: "*.mystifying-lederberg8.im.grycap.net"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-mystifying-lederberg8.im.grycap.net-tls
      allowedRoutes:
        namespaces:
          from: All
