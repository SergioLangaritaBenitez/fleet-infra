---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oscar
  namespace: oscar
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: oscar
  path: "./deploy/yaml"
  prune: true
  timeout: 1m
patches:
  - patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: oscar
    spec:
      values:
        minIO:
          TLSVerify: false
          accessKey: minio
          secretKey: minio123
        volume:
          storageClassName: nfs
        authUser: oscar
        authPass: oscar123
        service:
          type: NodePort
          nodePort: 30302