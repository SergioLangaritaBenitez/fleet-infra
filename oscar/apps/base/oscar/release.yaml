apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oscar
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: oscar
    namespace: flux-system
  path: "./deploy/yaml"
  prune: true
  timeout: 1m
  postBuild:
    substitute:
      OSCAR_IMAGE: "ghcr.io/grycap/oscar:4.2.1" # {"$imagepolicy": "flux-system:oscar"}
    substituteFrom:
      - kind: Secret
        name: gateway-tls-config
  patches:
    # Todas las env vars llegan SOLO via envFrom:
    # - ConfigMap/oscar-env (configmap.yaml de esta carpeta, en Git)
    # - Secret/oscar-credentials (secret.example.yaml como plantilla,
    #   creado a mano fuera de Git)
    # Los 7 literales de upstream (oscar-deployment.yaml) se borran con
    # $patch: delete para que no tapen al envFrom (env explícito gana a
    # envFrom). NOTA: en `describe` seguirán viéndose (resueltas desde
    # CM/Secret con valores planos); ocultarlas exigiría cambiar OSCAR
    # para leer de ficheros. Sin patchesJson6902 porque el CRD de
    # Kustomization del clúster no declara ese campo (solo strategic merge).
    - patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: oscar
        spec:
          template:
            spec:
              containers:
                - name: oscar
                  image: ${OSCAR_IMAGE}
                  envFrom:
                    - configMapRef:
                        name: oscar-env
                    - secretRef:
                        name: oscar-credentials
                  env:
                    - name: OSCAR_USERNAME
                      $patch: delete
                    - name: OSCAR_PASSWORD
                      $patch: delete
                    - name: MINIO_ACCESS_KEY
                      $patch: delete
                    - name: MINIO_SECRET_KEY
                      $patch: delete
                    - name: MINIO_TLS_VERIFY
                      $patch: delete
                    - name: MINIO_ENDPOINT
                      $patch: delete
                    - name: SERVERLESS_BACKEND
                      $patch: delete
      target:
        kind: Deployment
        name: oscar
    # The live deploy only sets requests (500m/512Mi); upstream adds
    # lower limits (250m/256Mi) and the API rejects it
    # (requests must be <= limits). Limits are removed.
    - patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: oscar
        spec:
          template:
            spec:
              containers:
                - name: oscar
                  resources:
                    limits: null
      target:
        kind: Deployment
        name: oscar
    # PVC oscar-pvc already exists in the cluster (Bound, managed-nfs-storage)
    # and storageClassName is immutable: request the one it already has.
    - patch: |-
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: oscar-pvc
        spec:
          storageClassName: managed-nfs-storage
      target:
        kind: PersistentVolumeClaim
        name: oscar-pvc
