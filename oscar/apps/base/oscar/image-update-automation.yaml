---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: oscar
  namespace: flux-system
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: "chore: update oscar image {{range $_, $changes := .Changed.Objects}}{{range $_, $change := $changes}}to {{$change.NewValue}} {{end}}{{end}}"
    push:
      branch: main
  update:
    path: ./oscar/apps
    strategy: Setters