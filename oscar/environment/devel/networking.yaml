---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: networking
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./oscar/infrastructure/networking
  prune: true
  wait: true
  # Variables por clúster (hostnames y nombres de Secrets TLS) desde
  # Secret/gateway-tls-config en ns flux-system (fuera de Git).
  postBuild:
    substituteFrom:
      - kind: Secret
        name: gateway-tls-config
---