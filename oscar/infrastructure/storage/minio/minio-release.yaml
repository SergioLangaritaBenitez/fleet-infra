---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: minio
  labels:
    reconcile.fluxcd.io/watch: Enabled
spec:
  chart:
    spec:
      chart: minio
      version: '4.0.7'
      sourceRef:
        kind: HelmRepository
        name: minio
      interval: 5m
  releaseName: minio
  interval: 10m
  values:
    image:
      repository: pgsty/silo
      tag: RELEASE.2026-09-16T00-00-00Z
    mcImage:
      repository: pgsty/mc
      tag: RELEASE.2026-09-16T00-00-00Z
    replicaCount: 2
    resources:
        requests:
            memory: 512Mi
    replicas: 1
    persistence:
        enabled: false
    mode: standalone
    # Credenciales gestionadas fuera de Git via Secret/minio-root-credentials
    # (ns minio). OJO: no usar el nombre `minio`, ese Secret lo crea/gestiona
    # el propio chart y Helm lo borra en cada upgrade si deja de renderizarlo.
    # Ver secrets/README.md para rotación.
    existingSecret: minio-root-credentials
    # Sin usuarios extra: el job make-user del chart 4.0.7 usa
    # `mc admin policy add`, eliminado en mc modernos (falla el upgrade).
    # A la consola se accede con el root del Secret.
    users: []
    service:
        type: NodePort
        nodePort: 30300
    consoleService:
        type: NodePort
        nodePort: 30301
    environment:
        MINIO_BROWSER_REDIRECT_URL: http://localhost:30301
