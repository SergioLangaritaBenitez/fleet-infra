---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-devel
  namespace: flux-system
spec:
  dependsOn:
    - name: storage
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./oscar/apps/devel
  prune: true
  wait: true