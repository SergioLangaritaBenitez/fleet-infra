---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oscar
  namespace: oscar
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: oscar
  path: "./deploy/yaml"
  prune: true
  timeout: 1m
  patches:
    - patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: oscar
          namespace: oscar
        spec:
          env:
          - name: MINIO_ENDPOINT
            value: http://10.244.3.2:9000     
