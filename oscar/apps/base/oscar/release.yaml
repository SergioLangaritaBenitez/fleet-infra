apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oscar
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: oscar
    namespace: flux-system
  path: "./deploy/yaml"
  prune: true
  timeout: 1m
  postBuild:
    substitute:
      OSCAR_IMAGE: "ghcr.io/grycap/oscar:4.2.0" # {"$imagepolicy": "flux-system:oscar"}
    substituteFrom:
      - kind: Secret
        name: gateway-tls-config
  patches:
    - patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: oscar
        spec:
          template:
            spec:
              containers:
                - name: oscar
                  image: ${OSCAR_IMAGE}
                  env:
                    - name: SERVERLESS_BACKEND
                      value: "knative"
      target:
        kind: Deployment
        name: oscar
    # The live deploy only sets requests (500m/512Mi); upstream adds
    # lower limits (250m/256Mi) and the API rejects it
    # (requests must be <= limits). Limits are removed.
    - patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: oscar
        spec:
          template:
            spec:
              containers:
                - name: oscar
                  resources:
                    limits: null
      target:
        kind: Deployment
        name: oscar
    # App config pinned here so upstream defaults can no longer reset it.
    # Values come from Secret/oscar-config (ns oscar, outside Git):
    # the live Deployment was re-owned to Flux (see secrets/README.md),
    # so server-side apply stays conflict-free.
    - patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: oscar
        spec:
          template:
            spec:
              containers:
                - name: oscar
                  env:
                    - name: OSCAR_USERNAME
                      value: null
                      valueFrom:
                        secretKeyRef: {name: oscar-config, key: OSCAR_USERNAME}
                    - name: OSCAR_PASSWORD
                      value: null
                      valueFrom:
                        secretKeyRef: {name: oscar-config, key: OSCAR_PASSWORD}
                    - name: MINIO_ACCESS_KEY
                      value: null
                      valueFrom:
                        secretKeyRef: {name: oscar-config, key: MINIO_ACCESS_KEY}
                    - name: MINIO_SECRET_KEY
                      value: null
                      valueFrom:
                        secretKeyRef: {name: oscar-config, key: MINIO_SECRET_KEY}
                    - name: MINIO_TLS_VERIFY
                      value: null
                      valueFrom:
                        secretKeyRef: {name: oscar-config, key: MINIO_TLS_VERIFY}
                    - name: MINIO_ENDPOINT
                      value: null
                      valueFrom:
                        secretKeyRef: {name: oscar-config, key: MINIO_ENDPOINT}
      target:
        kind: Deployment
        name: oscar
    # PVC oscar-pvc already exists in the cluster (Bound, managed-nfs-storage)
    # and storageClassName is immutable: request the one it already has.
    - patch: |-
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: oscar-pvc
        spec:
          storageClassName: managed-nfs-storage
      target:
        kind: PersistentVolumeClaim
        name: oscar-pvc
