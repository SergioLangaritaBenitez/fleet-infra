---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oscar
  namespace: oscar
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: oscar
  path: "./deploy/yaml"
  prune: true
  timeout: 1m
  values:
      minIO.TLSVerify: false
      volume.storageClassName: nfs
      authUser: oscar
      authPass: oscar123
      service:
        type: NodePort
        nodePort: 30302