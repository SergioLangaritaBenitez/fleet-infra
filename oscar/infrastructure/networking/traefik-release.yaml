---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
  labels:
    reconcile.fluxcd.io/watch: Enabled
spec:
  chart:
    spec:
      chart: traefik
      version: "39.0.9"
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 5m
  releaseName: traefik
  interval: 10m
  values:
    service:
      type: NodePort
    ports:
      web:
        nodePort: 30000
      websecure:
        nodePort: 30043
    providers:
      kubernetesGateway:
        enabled: true
      kubernetesIngress:
        enabled: false
    gateway:
      enabled: true
