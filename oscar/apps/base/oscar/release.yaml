apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oscar
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: oscar
    namespace: flux-system
  path: "./deploy/yaml"
  prune: true
  timeout: 1m
  postBuild:
    substitute:
      OSCAR_IMAGE: "ghcr.io/grycap/oscar:4.1.2" # {"$imagepolicy": "flux-system:oscar"}
  patches:
    - patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: oscar
        spec:
          template:
            spec:
              containers:
                - name: oscar
                  image: ${OSCAR_IMAGE}
                  env:
                    - name: SERVERLESS_BACKEND
                      value: "knative"
      target:
        kind: Deployment
        name: oscar
