---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oscar
  namespace: oscar
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: oscar
  path: "./deploy/yaml"
  prune: true
  timeout: 1m
  patches:
    - patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: oscar
        spec:
          template:
            spec:
              containers:
                - name: oscar
                  image: ghcr.io/grycap/oscar:4.0.0 # {"$imagepolicy": "flux-system:oscar"}
                  env:
                    - name: SERVERLESS_BACKEND
                      value: "knative"
      target:
        kind: Deployment
        name: oscar