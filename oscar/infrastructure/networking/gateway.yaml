---
# Gateway defines the actual listeners.
# The GatewayClass is created and owned by the Traefik Helm chart.
# HTTPRoutes in any namespace can bind to it via parentRefs.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway
  namespace: traefik
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: All
