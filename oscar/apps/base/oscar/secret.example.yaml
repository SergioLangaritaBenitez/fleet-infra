---
# PLANTILLA del Secret con las 6 variables SENSIBLES de OSCAR.
# NO está en kustomization.yaml: NO lo aplica Flux.
# Crear a mano en cada clúster:
#
#   kubectl -n oscar create secret generic oscar-credentials \
#     --from-literal=OSCAR_USERNAME=<oscar-user> \
#     --from-literal=OSCAR_PASSWORD=<oscar-password> \
#     --from-literal=MINIO_ACCESS_KEY=<minio-user> \
#     --from-literal=MINIO_SECRET_KEY=<minio-password> \
#     --from-literal=OIDC_CLIENT_ID=<oidc-client-id> \
#     --from-literal=OIDC_CLIENT_SECRET=<oidc-client-secret> \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# MINIO_ACCESS_KEY / MINIO_SECRET_KEY deben coincidir con
# Secret/minio-root-credentials (ns minio).
# OIDC_CLIENT_ID / OIDC_CLIENT_SECRET pueden quedar vacíos si OIDC_ENABLE=false.
# Alternativa: copiar secrets/oscar-credentials.env.example a
# secrets/oscar-credentials.env (gitignored) y usar --from-env-file.
apiVersion: v1
kind: Secret
metadata:
  name: oscar-credentials
  namespace: oscar
type: Opaque
stringData:
  OSCAR_USERNAME: "CHANGEME"
  OSCAR_PASSWORD: "CHANGEME"
  MINIO_ACCESS_KEY: "CHANGEME"
  MINIO_SECRET_KEY: "CHANGEME"
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
