---
# Gateway defines the actual listeners.
# The GatewayClass is created and owned by the Traefik Helm chart.
# HTTPRoutes in any namespace can bind to it via parentRefs.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway
  namespace: traefik
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: All
    # Terminates TLS with each cluster's certificates (managed by
    # cert-manager, outside Flux) and serves the same HTTPRoutes over HTTPS.
    # Names vary per cluster: injected via postBuild substitute
    # from Secret/gateway-tls-config (ns flux-system). See secrets/README.md.
    # NOTE: this Traefik only processes the FIRST certificateRef of each
    # listener, so two listeners are used (same port, different
    # hostname), one per certificate.
    - name: websecure-apex
      protocol: HTTPS
      port: 8443
      hostname: ${GATEWAY_HOST_APEX}
      tls:
        mode: Terminate
        certificateRefs:
          - name: ${GATEWAY_TLS_APEX}
      allowedRoutes:
        namespaces:
          from: All
    - name: websecure-wildcard
      protocol: HTTPS
      port: 8443
      hostname: "*.${GATEWAY_HOST_BASE}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: ${GATEWAY_TLS_WILDCARD}
      allowedRoutes:
        namespaces:
          from: All
