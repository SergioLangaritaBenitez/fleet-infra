---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
  labels:
    reconcile.fluxcd.io/watch: Enabled
spec:
  chart:
    spec:
      chart: traefik
      version: "39.0.9"
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 5m
  releaseName: traefik
  interval: 10m
  values:
    service:
      type: NodePort
    ports:
      # NodePorts 80/443: the public IP enters via :80/:443 (NAT).
      # The apiserver allows the 80-35000 range (--service-node-port-range).
      web:
        nodePort: 80
      websecure:
        nodePort: 443
    providers:
      kubernetesGateway:
        enabled: true
      kubernetesIngress:
        enabled: false
    gateway:
      enabled: true
