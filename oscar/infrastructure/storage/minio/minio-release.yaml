---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: minio
  labels:
    reconcile.fluxcd.io/watch: Enabled
spec:
  chart:
    spec:
      chart: minio
      version: '4.0.7'
      sourceRef:
        kind: HelmRepository
        name: minio
      interval: 5m
  releaseName: minio
  interval: 10m
  values:
    image:
      repository: pgsty/silo
      tag: RELEASE.2026-09-16T00-00-00Z
    mcImage:
      repository: pgsty/mc
      tag: RELEASE.2026-09-16T00-00-00Z
    replicaCount: 2
    resources:
        requests:
            memory: 512Mi
    replicas: 1
    persistence:
        enabled: false
    mode: standalone
    # Credentials managed outside Git via Secret/minio-root-credentials
    # (ns minio). See secrets/README.md for rotation.
    # NOTE: do not use the name `minio`; that Secret is created/managed
    # by the chart itself and Helm deletes it on every upgrade once it
    # stops being rendered.
    existingSecret: minio-root-credentials
    # No extra users: the chart 4.0.7 make-user job uses
    # `mc admin policy add`, removed in modern mc (fails the upgrade).
    # The console is accessed with the root from the Secret.
    users: []
    service:
        type: NodePort
        nodePort: 30300
    consoleService:
        type: NodePort
        nodePort: 30301
    environment:
        MINIO_BROWSER_REDIRECT_URL: http://localhost:30301
